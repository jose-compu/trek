name: commit-on-branch
description: |
  Stage relevant files and commit with a message that explains why. Refuse AI or
  LLM co-author trailers. Run the git commands; do not only print them.
nodes:
  - id: select-files
    bash: |
      git status --porcelain
    timeout: 15000
  - id: draft-message
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Using $select-files.output, draft a commit message for those changes. The
      first line is a short summary. The body explains why the change was made,
      not what was changed. Do not commit yet.
    depends_on: [select-files]
  - id: refuse-ai-trailer
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Check $draft-message.output for AI, LLM, Cursor, or Claude co-author
      trailers. If any are present, refuse the commit and state that AI co-author
      trailers are not allowed. If none are present, state that the message is
      acceptable.
    depends_on: [draft-message]
  - id: stage-and-commit
    trigger_rule: all_success
    when: "$refuse-ai-trailer.output contains 'acceptable'"
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Stage the paths from $select-files.output with `git add`,
      then commit with `git commit -m` using the message from
      $draft-message.output. Do not add a Co-authored-by trailer. Do not push.
      Quote the commit hash from the command output.
    depends_on: [refuse-ai-trailer]
