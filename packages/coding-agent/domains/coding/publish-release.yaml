name: publish-release
description: |
  Tag a semver release and publish host release assets. Refuse AI co-author
  trailers on the tag message. Do not force-push main or rewrite an existing
  floating major tag without an explicit re-release ask.
nodes:
  - id: detect-host
    include: _detect-host
    returns: $detect-host.check.output
  - id: identify-version
    allowed_tools: []
    output_type: findings
    prompt: |
      Name the semver tag to publish (for example v1.2.3). Prefer an explicit
      version from $USER_MESSAGE. If the turn only says publish or ship a
      release, state that the version is missing and do not invent one.
    depends_on: [detect-host]
  - id: verify-main
    trigger_rule: all_success
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Verify HEAD is on main or master (or the release branch named
      in the turn) and that the working tree is clean enough to tag. Use
      `git branch --show-current` and `git status --porcelain`. Quote the results.
    depends_on: [identify-version]
  - id: draft-notes
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Draft short release notes for the tag from $identify-version.output. One
      line summary plus the main changes. Do not invent changelog entries that
      are not in the turn or repo docs already named.
    depends_on: [verify-main]
  - id: refuse-ai-trailer
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Check $draft-notes.output for AI, LLM, Cursor, or Claude co-author credits.
      If any are present, refuse the release and state that AI attribution is not
      allowed on tags or release notes. If none are present, state that the notes
      are acceptable.
    depends_on: [draft-notes]
  - id: tag-command
    trigger_rule: all_success
    when: "$refuse-ai-trailer.output contains 'acceptable'"
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Create an annotated tag for $identify-version.output with the
      notes from $draft-notes.output (`git tag -a <tag> -m "<summary>"`), then
      push that tag (`git push origin <tag>`). Quote the tag name.
    depends_on: [refuse-ai-trailer]
  - id: publish-command
    trigger_rule: all_success
    when: "$detect-host.output != 'none'"
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Publish the release for the tag from $identify-version.output
      with the host CLI from $detect-host.output (gh release create, glab release
      create, or tea) using notes from $draft-notes.output. Quote the release URL.
      Do not force-push main or delete an existing tag unless the user asked for a
      re-release.
    depends_on: [tag-command]
