name: commit-on-branch
description: |
  Stage relevant files and commit with a message that explains why. Refuse AI or
  LLM co-author trailers.
nodes:
  - id: select-files
    allowed_tools: []
    output_type: findings
    prompt: |
      List the files changed by this turn. One path per line. Do not stage them
      yet.
  - id: draft-message
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Draft a commit message. The first line is a short summary. The body
      explains why the change was made, not what was changed. Do not commit yet.
    depends_on: [select-files]
  - id: refuse-ai-trailer
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Check $draft-message.output for AI, LLM, Cursor, or Claude co-author
      trailers. If any are present, refuse the commit and state that AI co-author
      trailers are not allowed. If none are present, state that the message is
      acceptable.
    depends_on: [draft-message]
  - id: stage-and-commit
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      State the commands to stage the files from $select-files.output and commit
      with the message from $draft-message.output, only if
      $refuse-ai-trailer.output says the message is acceptable. Do not run them.
      The commands are `git add <files>` and `git commit -m "<message>"`.
    depends_on: [refuse-ai-trailer]
