name: _detect-host
description: |
  Detect which host CLI is present: gh for GitHub, glab for GitLab, tea for
  Forgejo. If none are present, state that clearly. Prefixed with _ to indicate
  this is a utility workflow for inclusion.
nodes:
  - id: check
    bash: |
      if command -v gh >/dev/null 2>&1; then echo gh
      elif command -v glab >/dev/null 2>&1; then echo glab
      elif command -v tea >/dev/null 2>&1; then echo tea
      else echo none
      fi
    timeout: 10000
