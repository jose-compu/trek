name: open-pr
description: |
  Push the branch upstream and open a pull request or merge request. Include a
  summary and test plan. Do not merge.
nodes:
  - id: verify-branch
    allowed_tools: []
    output_type: findings
    prompt: |
      State the current branch name. Verify it is not main or master. If it is,
      state that PRs cannot be opened from the main branch.
  - id: push-upstream
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      State the command to push the branch upstream with tracking. Do not run it.
      The command is `git push -u origin <branch-name>`.
    depends_on: [verify-branch]
  - id: draft-pr-body
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Draft the PR summary. Include what changed, why, and the test plan. Use a
      HEREDOC or multi-line format. Do not open the PR yet.
    depends_on: [push-upstream]
  - id: detect-host
    include: _detect-host
    returns: $detect-host.check.output
    depends_on: [draft-pr-body]
  - id: open-pr-command
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      State the command to open the PR with the detected host CLI from
      $detect-host.output. Use the title from the branch name and the body from
      $draft-pr-body.output. Do not run it. If no host CLI was detected, state
      that the PR cannot be opened without a host CLI.
    depends_on: [detect-host]
