name: publish-release
description: |
  Tag a semver release and publish host release assets. Refuse AI co-author
  trailers on the tag message. Do not force-push main or rewrite an existing
  floating major tag without an explicit re-release ask.
nodes:
  - id: detect-host
    include: _detect-host
    returns: $detect-host.check.output
  - id: identify-version
    allowed_tools: []
    output_type: findings
    prompt: |
      Name the semver tag to publish (for example v1.2.3). Prefer an explicit
      version from $USER_MESSAGE. If the turn only says publish or ship a
      release, state that the version is missing and do not invent one.
    depends_on: [detect-host]
  - id: verify-main
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      State how to verify HEAD is on main or master (or the release branch named
      in the turn) and that the working tree is clean enough to tag. Do not run
      the commands yet.
    depends_on: [identify-version]
  - id: draft-notes
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Draft short release notes for the tag from $identify-version.output. One
      line summary plus the main changes. Do not invent changelog entries that
      are not in the turn or repo docs already named.
    depends_on: [verify-main]
  - id: refuse-ai-trailer
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Check $draft-notes.output for AI, LLM, Cursor, or Claude co-author credits.
      If any are present, refuse the release and state that AI attribution is not
      allowed on tags or release notes. If none are present, state that the notes
      are acceptable.
    depends_on: [draft-notes]
  - id: tag-command
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      State the annotated tag command for $identify-version.output using the
      notes from $draft-notes.output, only if $refuse-ai-trailer.output says the
      notes are acceptable. Do not run it. Prefer
      `git tag -a <tag> -m "<summary>"` then `git push origin <tag>`.
    depends_on: [refuse-ai-trailer]
  - id: publish-command
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      State the host CLI command to publish the release for the tag from
      $identify-version.output using $detect-host.output (gh release create,
      glab release create, or tea). Include the notes from $draft-notes.output.
      Do not run it. If no host CLI was detected, state that the release cannot
      be published without a host CLI. Do not force-push main or delete an
      existing tag unless the user asked for a re-release.
    depends_on: [tag-command]
