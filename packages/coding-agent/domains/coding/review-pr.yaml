name: review-pr
description: |
  Review a pull request diff. Approve or request changes. Do not merge.
nodes:
  - id: detect-host
    include: _detect-host
    returns: $detect-host.check.output
  - id: fetch-diff
    trigger_rule: all_success
    when: "$detect-host.output != 'none'"
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Name the PR from the user turn. Fetch its diff with the host
      CLI from $detect-host.output (for example `gh pr diff`). Keep the full
      diff text in the reply.
    depends_on: [detect-host]
  - id: read-diff
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Read the diff from $fetch-diff.output. Summarize the changes in one
      paragraph. Do not review yet.
    depends_on: [fetch-diff]
  - id: findings
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Review the diff from $read-diff.output. List findings: bugs, style issues,
      missing tests, unclear logic. One finding per line. If none, state that the
      diff is clean.
    depends_on: [read-diff]
  - id: verdict
    trigger_rule: all_success
    when: "$detect-host.output != 'none'"
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Approve the PR if $findings.output is clean, or request
      changes if findings were listed, using the host CLI from
      $detect-host.output. Do not merge the PR. Quote the review result.
    depends_on: [findings]
