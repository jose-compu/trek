name: address-review
description: |
  Reply to review threads and make follow-up commits to address feedback.
  Reuses commit-on-branch for the commit step.
nodes:
  - id: detect-host
    include: _detect-host
    returns: $detect-host.check.output
  - id: list-threads
    trigger_rule: all_success
    when: "$detect-host.output != 'none'"
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. List the review threads that need a reply with the host CLI
      from $detect-host.output. One thread per line with the comment and its
      location. Do not reply yet.
    depends_on: [detect-host]
  - id: draft-replies
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Draft a reply for each thread from $list-threads.output. Each reply
      explains what will be done or why the suggestion does not apply. Do not post
      yet.
    depends_on: [list-threads]
  - id: plan-changes
    trigger_rule: all_success
    allowed_tools: [read]
    output_type: findings
    prompt: |
      Plan the code changes to address the review feedback. List files and changes.
      You may read files. Do not implement yet.
    depends_on: [draft-replies]
  - id: apply-changes
    trigger_rule: all_success
    allowed_tools: [read, edit, write, bash]
    output_type: findings
    prompt: |
      Apply the plan from $plan-changes.output. Use read, edit, write, and bash as
      needed. Do not commit yet.
    depends_on: [plan-changes]
  - id: commit
    include: commit-on-branch
    returns: $commit.stage-and-commit.output
    depends_on: [apply-changes]
  - id: post-replies
    trigger_rule: all_success
    when: "$detect-host.output != 'none'"
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Post the replies from $draft-replies.output with the host CLI
      from $detect-host.output after the commit from $commit.output. Quote each
      posted reply result.
    depends_on: [commit]
