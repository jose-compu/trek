name: model-quality
description: |
  Check a model-quality drop: RAG retrieval, hallucination rate, token cost, or a context window overflow. Do not call a provider from this workflow.
nodes:
  - id: observe
    allowed_tools: []
    output_type: findings
    prompt: |
      Name the failure: quality, latency, cost, retrieval, or a guardrail miss. Quote the symptom, not a guess.
  - id: compare-config
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Compare the model, prompt, and settings in use with the last known good configuration. One difference is enough.
    depends_on: [observe]
  - id: check-retrieval
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      If the answer depends on retrieved text, say whether the chunks are relevant or stale. If retrieval is not involved, say so.
    depends_on: [compare-config]
  - id: check-cost
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      State whether token cost or the context window is the limit. Do not invent a price.
    depends_on: [check-retrieval]
  - id: recommend
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Recommend one change. Do not switch providers or rewrite the system prompt unless this turn asked for that.
    depends_on: [check-cost]
