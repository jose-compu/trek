name: layer-route
description: |
  Decision routes the turn to Scripts or Workhorse. Unsure goes to Workhorse. Never Tooling.
nodes:
  - id: classify
    allowed_tools: []
    output_type: findings
    output_format:
      type: object
      additionalProperties: false
      required: [action, target, confidence, reason, evidence]
      properties:
        action: { type: string }
        target: { type: string }
        confidence: { type: string }
        reason: { type: string }
        evidence: { type: array, items: { type: string } }
    prompt: |
      Classify this turn: $USER_MESSAGE. Emit LayerDecision JSON. target must be script or workhorse.
  - id: script
    allowed_tools: []
    output_type: plan
    when: "$classify.output contains 'script'"
    trigger_rule: all_success
    prompt: |
      Route to Scripts. No chat model on the mechanical steps. Classify: $classify.output
    depends_on: [classify]
  - id: workhorse
    allowed_tools: []
    output_type: plan
    when: "$classify.output contains 'workhorse' || $classify.output contains 'continue'"
    trigger_rule: all_success
    prompt: |
      Route to Workhorse. Tooling is a later delegate, not this route. Classify: $classify.output
    depends_on: [classify]
