name: split-epic-issues
description: |
  Split one epic into child issues with Done when acceptance criteria. Fan out
  each drafted issue through open-issue. Use the detected host CLI.
nodes:
  - id: detect-host
    include: _detect-host
    returns: $detect-host.check.output
  - id: identify-epic
    allowed_tools: []
    output_type: findings
    prompt: |
      Name the epic to split. State its title and scope. Do not create issues yet.
    depends_on: [detect-host]
  - id: draft-issues
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      List the child issues under this epic as a JSON array. Each item has title,
      body, and done_when. One issue per discrete task. Do not file yet.
    depends_on: [identify-epic]
  - id: select-labels
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Suggest labels for each issue from $draft-issues.output. Common labels: bug,
      enhancement, documentation, good-first-issue. One line per issue.
    depends_on: [draft-issues]
  - id: file-issues
    fan_out:
      items: $draft-issues.output
      workflow: open-issue
      max_parallel: 3
      join: all_success
    depends_on: [select-labels]
