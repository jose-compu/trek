# Static AI-safety scan (Lacan). Findings at/above fail-on fail the job.
# False positives are skipped in `.lacan.toml` (loaded automatically).
name: Lacan Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lacan-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lacan Scan
        uses: jose-compu/lacan-scan@v5
        with:
          path: .
          fail-on: HIGH
          output: sarif,cli
          sarif-file: lacan.sarif
          version: "5"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('lacan.sarif') != ''
        with:
          sarif_file: lacan.sarif
          category: lacan
