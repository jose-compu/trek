  - batna_weakness
  - framing_miss
  - objection_handling_gap
  - escalation_misalignment
  - value_articulation_gap
  - anchor_error
  - agreement_risk
areas:
  - preparation
  - discovery
  - framing
  - bargaining
  - concessions
  - closing
  - stakeholder_alignment
