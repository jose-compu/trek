name: open-pr
description: |
  Push the branch upstream and open a pull request or merge request. Include a
  summary and test plan. Compose commit-on-branch and Belay. Do not merge.
nodes:
  - id: verify-branch
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Print the current branch with `git branch --show-current`.
      If it is main or master, refuse and state that PRs cannot be opened from
      the main branch.
  - id: commit
    include: commit-on-branch
    returns: $commit.stage-and-commit.output
    depends_on: [verify-branch]
  - id: push-upstream
    trigger_rule: all_success
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Push the current branch upstream with tracking using
      `git push -u origin HEAD`. Quote the remote tracking result.
    depends_on: [commit]
  - id: draft-pr-body
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Draft the PR summary. Include what changed, why, and the test plan. Use a
      HEREDOC or multi-line format. Do not open the PR yet.
    depends_on: [push-upstream]
  - id: belay
    include: belay-pr
    returns: $belay.verdict.output
    depends_on: [draft-pr-body]
  - id: detect-host
    include: _detect-host
    returns: $detect-host.check.output
    depends_on: [belay]
  - id: open-pr-command
    trigger_rule: all_success
    when: "$detect-host.output != 'none'"
    allowed_tools: [bash]
    output_type: findings
    prompt: |
      Run bash now. Open the PR with the host CLI from $detect-host.output. Use a
      title from the branch name and the body from $draft-pr-body.output. Include
      the Belay verdict from $belay.output in the description. Quote the PR URL.
      Do not merge.
    depends_on: [detect-host]
