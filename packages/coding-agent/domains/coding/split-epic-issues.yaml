name: split-epic-issues
description: |
  Split one epic into child issues with Done when acceptance criteria. Use the
  detected host CLI.
nodes:
  - id: identify-epic
    allowed_tools: []
    output_type: findings
    prompt: |
      Name the epic to split. State its title and scope. Do not create issues yet.
  - id: draft-issues
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      List the child issues under this epic. Each issue has a title, body, and
      Done when section with acceptance criteria. One issue per discrete task. Do
      not file yet.
    depends_on: [identify-epic]
  - id: select-labels
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Suggest labels for each issue from $draft-issues.output. Common labels: bug,
      enhancement, documentation, good-first-issue. One line per issue.
    depends_on: [draft-issues]
  - id: file-issues-command
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      State the commands to file the issues from $draft-issues.output with labels
      from $select-labels.output, linked to the epic from $identify-epic.output,
      using the host CLI (gh, glab, or tea). Do not run them. If no host CLI is
      available, state that issues cannot be filed without it.
    depends_on: [select-labels]
