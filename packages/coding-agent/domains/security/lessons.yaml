domain: security
categories:
  - vulnerability
  - misconfiguration
  - access_violation
  - compliance_gap
  - incident_response
  - threat_intelligence
areas:
  - authentication
  - authorization
  - encryption
  - network
  - endpoint
  - compliance
  - cloud
severity:
  default: medium
  vulnerability: critical
  access_violation: critical
  incident_response: high
  misconfiguration: high
before_after: false
fields:
  - name: cvss
    required: false
  - name: cwe
    required: false
  - name: blast_radius
    required: false
  - name: remediation
    required: true
promotion_targets:
  - id: hardening-checklist
    title: hardening checklist
  - id: playbooks
    title: playbooks
  - id: compliance-list
    title: compliance list
  - id: agent-soul
    title: agent soul
  - id: agent-rules
    title: agent rules
  - id: agent-tools
    title: agent tools
promotion_threshold:
  count: 3
  severity: critical
redact:
  - '\b(?:api[_-]?key|secret|token|password)\s*[:=]\s*\S{8,}'
  - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
