name: flow-break
description: |
  Examine a stockout, a longer supplier lead time, or a backorder. Do not place an order.
nodes:
  - id: name-sku
    allowed_tools: []
    output_type: findings
    prompt: |
      Name the SKU, the site, and whether this is a stockout or a backorder.
  - id: forecast-vs-stock
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Separate the demand figure the user gave from the stock figure. Do not invent either.
    depends_on: [name-sku]
  - id: next-check
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Name the next check on supplier lead time or the warehouse. Do not place an order.
    depends_on: [forecast-vs-stock]
