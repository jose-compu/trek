domain: support
categories:
  - resolution_delay
  - misdiagnosis
  - escalation_gap
  - knowledge_gap
  - sla_breach
  - customer_churn_signal
areas:
  - triage
  - diagnosis
  - resolution
  - follow_up
  - documentation
  - escalation
severity:
  default: medium
  sla_breach: high
  customer_churn_signal: high
  escalation_gap: high
before_after: false
fields:
  - name: ticket_class
    required: false
  - name: customer_impact
    required: false
promotion_targets:
  - id: kb-article
    title: KB article
  - id: troubleshooting-tree
    title: troubleshooting tree
  - id: escalation-matrix
    title: escalation matrix
  - id: canned-response
    title: canned response template
  - id: agent-soul
    title: agent soul
  - id: agent-rules
    title: agent rules
  - id: agent-tools
    title: agent tools
promotion_threshold:
  count: 3
  severity: critical
redact:
  - '\b(?:email|phone)\s*[:=]\s*\S+'
