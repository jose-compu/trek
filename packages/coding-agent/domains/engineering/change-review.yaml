name: change-review
description: |
  Review an engineering change: a build failed, an architecture violation, a flaky test, or tech debt. Trek is a coding agent, so this domain stays on.
nodes:
  - id: state-constraint
    prompt: |
      Quote the architecture violation in the words the user turn already uses. One line. If it is not named, say it is not in the turn.
  - id: check-build
    prompt: |
      Quote the build, test, or dependency failure from the user turn. One line. If none is named, say none has been run.
    depends_on: [state-constraint]
  - id: name-debt
    prompt: |
      Quote the tech debt from the user turn. One line. If it is not named, say it is not in the turn.
    depends_on: [check-build]
  - id: apply-or-refuse
    prompt: |
      Do not edit and do not run a tool. One line: refuse the change, or say the facts are not in the turn.
    depends_on: [name-debt]
