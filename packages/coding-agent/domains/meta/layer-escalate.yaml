name: layer-escalate
description: |
  Workhorse writes the handoff brief, Planning takes the plan and the steps back.
nodes:
  - id: handoff-brief
    role: workhorse
    effort: low
    allowed_tools: []
    output_type: findings
    prompt: |
      Write labeled lines (goal, constraints, tried, evidence, open question) for: $USER_MESSAGE
      Do not write JSON.
  - id: plan
    role: planning
    effort: high
    allowed_tools: []
    output_type: plan
    context: shared
    trigger_rule: all_success
    prompt: |
      Write a short plan from $handoff-brief.output. Do not repeat failed steps.
    depends_on: [handoff-brief]
  - id: steps-back
    role: planning
    effort: medium
    allowed_tools: []
    output_type: plan
    trigger_rule: all_success
    prompt: |
      Name the steps Workhorse should take after this climb. Plan: $plan.output
    depends_on: [plan]
