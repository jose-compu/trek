name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string

permissions: {}

jobs:
  # bindings() cannot see B:/~BUN/root. These jobs produce the real addon
  # that the archive places at native/logosdb.node.
  logosdb-native:
    name: logosdb ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest is Visual Studio 18. node-gyp 11 does not recognize it
          # (version "undefined"), so the native addon never builds. windows-2022
          # still has Visual Studio 2022.
          - os: windows-2022
            platform: windows-x64
          - os: macos-latest
            platform: darwin-arm64
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Build logosdb.node
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/coding-agent/package.json').dependencies.logosdb")"
          prefix="${RUNNER_TEMP}/logosdb-native"
          npm install --prefix "$prefix" "logosdb@${version}"
          src=""
          while IFS= read -r candidate; do
            src="$candidate"
            break
          done < <(find "$prefix/node_modules/logosdb" -name 'logosdb.node')
          if [[ -z "$src" ]]; then
            echo "logosdb.node was not produced for ${{ matrix.platform }}"
            find "$prefix/node_modules/logosdb" -maxdepth 4 -type d -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/native-out"
          cp "$src" "$GITHUB_WORKSPACE/native-out/logosdb.node"
          echo "packed $src"

      - name: Upload logosdb.node
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: native-out/logosdb.node
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: logosdb-native
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download LogosDB addons
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: windows-x64
          path: native-addons/windows-x64
          merge-multiple: true

      - name: Download macOS LogosDB addon
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: darwin-arm64
          path: native-addons/darwin-arm64
          merge-multiple: true

      - name: Check LogosDB addon layout
        run: |
          test -f native-addons/windows-x64/logosdb.node
          test -f native-addons/darwin-arm64/logosdb.node

      - name: Install a C++ compiler for the Linux addon
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Build binaries
        env:
          LOGOSDB_NATIVE_DIR: ${{ github.workspace }}/native-addons
        run: ./scripts/build-binaries.sh

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          
          # Extract changelog section for this version
          cd packages/coding-agent
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md
          
          # If empty, use a default message
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${VERSION}" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/coding-agent/binaries

          RELEASE_FLAGS=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          
          # Create release with changelog notes (or update if exists)
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file /tmp/release-notes.md \
            "${RELEASE_FLAGS[@]}" \
            trek-darwin-arm64.tar.gz \
            trek-darwin-x64.tar.gz \
            trek-linux-x64.tar.gz \
            trek-linux-arm64.tar.gz \
            trek-windows-x64.zip \
            trek-windows-arm64.zip \
            2>/dev/null || \
          gh release upload "${RELEASE_TAG}" \
            trek-darwin-arm64.tar.gz \
            trek-darwin-x64.tar.gz \
            trek-linux-x64.tar.gz \
            trek-linux-arm64.tar.gz \
            trek-windows-x64.zip \
            trek-windows-arm64.zip \
            --clobber

  # GitHub release only. npm publish stays off.
  publish-npm:
    if: false
    runs-on: ubuntu-latest
    needs: build
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install LogosDB native binding
        run: npm rebuild logosdb

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify release artifacts are committed
        run: |
          git diff --exit-code -- \
            ':!packages/ai/src/models.generated.ts' \
            ':!packages/ai/src/image-models.generated.ts'

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      - name: Publish npm packages
        run: node scripts/publish.mjs
