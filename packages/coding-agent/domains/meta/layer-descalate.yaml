name: layer-descalate
description: |
  Planning writes the handoff and named steps, then Workhorse acts.
nodes:
  - id: handoff-brief
    role: planning
    effort: medium
    allowed_tools: []
    output_type: findings
    prompt: |
      Write labeled lines (goal, constraints, tried, evidence, open question) for: $USER_MESSAGE
      Do not write JSON.
  - id: named-steps
    role: planning
    allowed_tools: []
    output_type: plan
    trigger_rule: all_success
    prompt: |
      Name the remaining mechanical steps from $handoff-brief.output. No new architecture.
    depends_on: [handoff-brief]
  - id: workhorse-act
    role: workhorse
    effort: low
    allowed_tools: [read, write, edit, bash]
    output_type: code
    trigger_rule: all_success
    prompt: |
      Hand the named steps to Workhorse: $named-steps.output
    depends_on: [named-steps]
