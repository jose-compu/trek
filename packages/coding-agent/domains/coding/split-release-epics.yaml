name: split-release-epics
description: |
  Split a release or milestone into a parent epic and child epics. Fan out each
  child epic through open-issue (filed as an epic-labelled issue). Use the
  detected host CLI.
nodes:
  - id: detect-host
    include: _detect-host
    returns: $detect-host.check.output
  - id: identify-release
    allowed_tools: []
    output_type: findings
    prompt: |
      Name the release or milestone to split. State its version and the high-level
      goals. Do not create epics yet.
    depends_on: [detect-host]
  - id: draft-parent-epic
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      Draft the parent epic for the release from $identify-release.output. The
      title is the release version. The body is the release summary and links to
      ROADMAP or contributing docs if relevant. Do not file yet.
    depends_on: [identify-release]
  - id: file-parent
    include: open-issue
    returns: $file-parent.file-issue.output
    depends_on: [draft-parent-epic]
  - id: draft-child-epics
    trigger_rule: all_success
    allowed_tools: []
    output_type: findings
    prompt: |
      List the child epics under this release as a JSON array. One epic per major
      feature or area. Each item has title and body. Do not file yet.
    depends_on: [file-parent]
  - id: file-child-epics
    fan_out:
      items: $draft-child-epics.output
      workflow: open-issue
      max_parallel: 3
      join: all_success
    depends_on: [draft-child-epics]
