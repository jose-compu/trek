name: layer-consult
description: |
  Workhorse hands a brief to Frontier (or Planning + deep). Diagnose, then exit. Do not stay.
nodes:
  - id: handoff-brief
    role: workhorse
    effort: low
    allowed_tools: []
    output_type: findings
    prompt: |
      Write labeled lines (goal, constraints, tried, evidence, open question) for: $USER_MESSAGE
      Do not write JSON.
  - id: diagnose
    role: frontier
    effort: high
    allowed_tools: []
    output_type: findings
    context: fresh
    trigger_rule: all_success
    prompt: |
      Diagnose using $handoff-brief.output. Do not take over the session.
    depends_on: [handoff-brief]
  - id: exit
    role: frontier
    allowed_tools: []
    output_type: findings
    trigger_rule: all_success
    prompt: |
      Return a consult result from $diagnose.output and exit. Do not stay on Frontier.
    depends_on: [diagnose]
