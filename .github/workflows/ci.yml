name: CI

# Local Husky hooks (check + affected tests on commit, build on push) replace per-PR CI.
# This job runs once a day at 05:00 UTC, and only if main moved in the last 24h.
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC (06:00 CET / 07:00 CEST)
  workflow_dispatch:

concurrency:
  group: ci-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recent-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'refs/heads/main' }}

      - name: Run only after commits in the last 24 hours
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log --since="24 hours ago" --pretty=%H | grep -q .; then
            echo "Commits in the last 24 hours:"
            git log --since="24 hours ago" --oneline
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits on main in the last 24 hours; skipping CI."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-check-test:
    needs: recent-changes
    if: needs.recent-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install LogosDB native binding
        run: npm rebuild logosdb

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: ./test.sh
